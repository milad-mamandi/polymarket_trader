# Logrotate configuration for Whale Scout Bot
# Install to: /etc/logrotate.d/whale-scout

/opt/whale-scout/logs/*.log {
    # Rotate logs daily
    daily
    
    # Keep 14 days of logs
    rotate 14
    
    # Compress old logs
    compress
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate empty logs
    notifempty
    
    # Create new log files with these permissions
    create 0640 whale-scout whale-scout
    
    # Use date extension instead of numbers
    dateext
    dateformat -%Y-%m-%d
    
    # Truncate original log file after creating copy
    copytruncate
    
    # Post-rotation script (optional: notify systemd service)
    postrotate
        systemctl reload whale-scout.service > /dev/null 2>&1 || true
    endscript
}
